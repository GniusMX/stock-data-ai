name: Daily Stock Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Download stock and macro data
        run: |
          python main.py

      - name: Save CSV and ALLtec to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 直下のCSVに加え、semi_constituents/ など下のフォルダのCSVも保存する
          # （'*.csv' を引用符で囲むと、シェルではなくGitがフォルダの中まで一致させる）
          git add -- '*.csv'
          git add ALLtec.txt
          if [ -f EXTRA_DATA_STATUS.txt ]; then git add EXTRA_DATA_STATUS.txt; fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update stock and macro data"

          git pull --rebase origin main

          git push origin main
