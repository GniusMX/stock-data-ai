name: Daily Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download stock and volatility data
        run: python main.py

      - name: Save CSV to GitHub
        run: 
             git add SMH_historical.csv
             git add QQQ_historical.csv
             git add VIX_historical.csv
             git add VIX3M_historical.csv
             git add SMH_technical.csv
             git add QQQ_technical.csv
             git add VIX_technical.csv
             git add VIX3M_technical.csv
             git diff --cached --quiet || git commit -m "Update stock and volatility data"
             git pull --rebase origin main
             git push origin main
